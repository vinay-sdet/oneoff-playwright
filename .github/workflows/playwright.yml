name: Playwright validation

on:
  workflow_dispatch:
    inputs:
      expected_title:
        description: Title expected in the browser page
        required: true
        default: First Project
        type: string
      expected_text:
        description: Visible text expected on the page
        required: true
        default: Hello World
        type: string
      app_url:
        description: URL of the app to test
        required: true
        default: http://localhost:8080
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tests
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          APP_URL: ${{ inputs.app_url }}
          EXPECTED_TITLE: ${{ inputs.expected_title }}
          EXPECTED_TEXT: ${{ inputs.expected_text }}
        run: |
          npx playwright test --reporter=html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
