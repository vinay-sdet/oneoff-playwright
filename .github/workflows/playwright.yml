name: Playwright validation

on:
  repository_dispatch:
    types: [app_deployed]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.client_payload.app_url || 'http://localhost:8080' }}
      EXPECTED_TITLE: ${{ github.event.client_payload.expected_title || 'First Project' }}
      EXPECTED_TEXT: ${{ github.event.client_payload.expected_text || 'Hello World' }}

    steps:
      - name: Check out tests
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          npx playwright test --reporter=html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
